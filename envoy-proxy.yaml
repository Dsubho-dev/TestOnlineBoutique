apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-proxy-config
  namespace: onlineboutique
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_http
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend_services
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/cart"
                    route:
                      cluster: cartservice_cluster
                      prefix_rewrite: "/"
                  - match:
                      prefix: "/checkout"
                    route:
                      cluster: checkoutservice_cluster
                      prefix_rewrite: "/"
                  - match:
                      prefix: "/products"
                    route:
                      cluster: productcatalogservice_cluster
                      prefix_rewrite: "/"
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: cartservice_cluster
        connect_timeout: 0.25s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: cartservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: cartservice.onlineboutique.svc.cluster.local
                    port_value: 7070
        http2_protocol_options: {}

      - name: checkoutservice_cluster
        connect_timeout: 0.25s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: checkoutservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: checkoutservice.onlineboutique.svc.cluster.local
                    port_value: 5050
        http2_protocol_options: {}

      - name: productcatalogservice_cluster
        connect_timeout: 0.25s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: productcatalogservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: productcatalogservice.onlineboutique.svc.cluster.local
                    port_value: 3550
        http2_protocol_options: {}

    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
---
apiVersion: v1
kind: Pod
metadata:
  name: envoy-proxy
  namespace: onlineboutique
  labels:
    app: envoy-proxy
spec:
  containers:
  - name: envoy
    image: envoyproxy/envoy:v1.30-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
    - containerPort: 8080
      name: http
    - containerPort: 9901
      name: admin
    volumeMounts:
    - name: envoy-config
      mountPath: /etc/envoy
      readOnly: true
  volumes:
  - name: envoy-config
    configMap:
      name: envoy-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-proxy
  namespace: onlineboutique
spec:
  selector:
    app: envoy-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: admin
    port: 9901
    targetPort: 9901
