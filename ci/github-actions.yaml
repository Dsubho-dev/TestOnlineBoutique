name: TestOnlineBoutique CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.8'
  
jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort bandit safety
        
    - name: Run Black formatter check
      run: black --check --diff tests/
      
    - name: Run isort import sorting check  
      run: isort --check-only --diff tests/
      
    - name: Run flake8 linting
      run: flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
    - name: Run security checks with bandit
      run: bandit -r tests/ -f json -o bandit-report.json || true
      
    - name: Check for known security vulnerabilities
      run: safety check --json --output safety-report.json || true
      
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-html pytest-xdist
        
    - name: Run API tests with coverage
      run: |
        pytest tests/api/ -m api -v \
          --cov=tests \
          --cov-report=html:htmlcov \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing \
          --html=api-test-report.html \
          --self-contained-html \
          --junitxml=api-test-results.xml
          
    - name: Upload API test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: api-test-results-python-${{ matrix.python-version }}
        path: |
          api-test-report.html
          api-test-results.xml
          htmlcov/
          coverage.xml

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    strategy:
      matrix:
        browser: ['chrome', 'firefox']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-html pytest-xdist
        
    - name: Set up Chrome
      if: matrix.browser == 'chrome'
      uses: browser-actions/setup-chrome@latest
      
    - name: Set up Firefox
      if: matrix.browser == 'firefox'  
      uses: browser-actions/setup-firefox@latest
      
    - name: Run UI tests
      run: |
        pytest tests/ui/ -m ui -v \
          --html=ui-test-report-${{ matrix.browser }}.html \
          --self-contained-html \
          --junitxml=ui-test-results-${{ matrix.browser }}.xml
      env:
        BROWSER: ${{ matrix.browser }}
        
    - name: Upload UI test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ui-test-results-${{ matrix.browser }}
        path: |
          ui-test-report-${{ matrix.browser }}.html
          ui-test-results-${{ matrix.browser }}.xml

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-api, test-ui]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Kind cluster
      uses: helm/kind-action@v1.8.0
      with:
        config: infra/kind-cluster.yaml
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-html
        
    - name: Set up test infrastructure
      run: |
        chmod +x infra/setup.sh
        ./infra/setup.sh
        
    - name: Run integration tests
      run: |
        pytest -m integration -v \
          --html=integration-test-report.html \
          --self-contained-html \
          --junitxml=integration-test-results.xml
          
    - name: Cleanup test infrastructure
      if: always()
      run: |
        chmod +x infra/teardown.sh
        ./infra/teardown.sh
        
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          integration-test-report.html
          integration-test-results.xml

  test-coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download coverage artifacts
      uses: actions/download-artifact@v3
      with:
        pattern: api-test-results-python-*
        merge-multiple: true
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build test runner image
      run: |
        docker build -f - . <<EOF
        FROM python:${{ env.PYTHON_VERSION }}-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY tests/ tests/
        COPY ci/ ci/
        CMD ["pytest", "tests/", "-v"]
        EOF
        
  notify-status:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [test-api, test-ui, test-integration, docker-build]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.test-api.result == 'success' && needs.test-ui.result == 'success' && needs.test-integration.result == 'success'
      run: echo "✅ All tests passed successfully!"
      
    - name: Notify failure
      if: needs.test-api.result == 'failure' || needs.test-ui.result == 'failure' || needs.test-integration.result == 'failure'
      run: |
        echo "❌ Some tests failed:"
        echo "API Tests: ${{ needs.test-api.result }}"
        echo "UI Tests: ${{ needs.test-ui.result }}"  
        echo "Integration Tests: ${{ needs.test-integration.result }}"
        exit 1
